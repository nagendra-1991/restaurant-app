
name: Java CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Verify Java and Maven
      - name: Check Java Version
        run: java -version

      - name: Check Maven Version
        run: mvn -version

      # Step 4: Build and run tests
      - name: Build Application
        run: mvn -B clean verify

      # Step 5: Upload the JAR artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar
          if-no-files-found: warn
          retention-days: 7
      - name: build docker image
        run: docker build -t restaurant-app:v1.0 .
      - name: tag image
        run: docker tag restaurant-app:v1.0 nagendra915/restaurant-app
      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: push Docker Image
        run: |
          docker push restaurant-app:v1.0 nagendra915/restaurant-app
        
          
